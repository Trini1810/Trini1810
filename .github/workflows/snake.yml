name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Trini1810
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#B74242&color_dots=#161b22,#EA7362,#B74242,#5C2626,#381717
            dist/github-contribution-grid-snake-dark.svg?color_snake=#B74242&color_dots=#161b22,#EA7362,#B74242,#5C2626,#381717&palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
